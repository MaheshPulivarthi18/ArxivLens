name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, gofmt, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint-go
      - run: make test-go
      - name: Kafka consumer tests (verbose, race, coverage)
        run: go test -race -count=1 -v -coverprofile=c.out ./internal/kafka/ && go tool cover -func=c.out | grep consumer.go
      - name: LLM package tests (verbose, race, per-file coverage)
        run: |
          go test -race -count=1 -v -coverprofile=llm.out ./internal/llm/... && go tool cover -func=llm.out
          awk -F'[: ]' 'NR>1 {t[$1]+=$3; if ($4>0) c[$1]+=$3} END {for (f in t) printf "%s %.1f%%\n", f, 100*c[f]/t[f]}' llm.out | sort
      - run: make build-go

  python:
    name: Python M0 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-base-en-v1.5
      - name: Install deps (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-m0.txt minio ulid-py fastapi uvicorn
      - run: make test-py

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Test (if FE-1 has added a test script)
        run: if npm run | grep -q " test"; then npm test; else echo "no frontend tests yet"; fi
      - run: npm run build

  agent-ownership:
    name: Agent ownership check
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Agent branches stay inside their code area
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/ownership-check.sh "origin/$BASE_REF" "$HEAD_REF"
