name: Full stack

# Brings up infra + Python workers in compose, runs the Go downloader and query service on the host,
# crawls 2 papers to `embedded` and runs `make test-full`. No secrets. 5 arXiv requests per run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docker-compose.yml
      - services/*/Dockerfile
      - services/processor/**
      - services/embedder/**
      - services/common/**
      - shared/**
      - migrations/**
      - requirements*.txt
      - Makefile
      - .github/workflows/stack.yml
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - tests/**

permissions:
  contents: read

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: Full stack (compose + make test-full)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARXIVLENS_HF_CACHE: /home/runner/.cache/huggingface
      # Known failure F1 (Mahesh, 2026-11-04): CPU cross-encoder rerank makes /v1/ask take ~10 s, over M3's 10 s
      # client timeout. Deselected from AC4 and run on their own, visibly, in "Known failure F1". Tracked in OPS-H1 Notes.
      F1_TESTS: >-
        tests/test_m3_query.py::test_rag_ask_with_groundedness_support
        tests/test_m3_query.py::test_rag_early_refusal_on_unrelated_query
        tests/test_m3_query.py::test_hybrid_search_with_rrf_and_rerank
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Lint the harness (actionlint, compose config)
        timeout-minutes: 3
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/stack.yml
          docker compose config --quiet
          docker compose config --profiles | grep -qx workers

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-base-en-v1.5-bge-reranker-base

      - name: Host Python deps (make setup-py, CPU torch)
        timeout-minutes: 10
        run: make setup-py

      - name: Pre-fetch models into the shared HF cache
        timeout-minutes: 10
        run: |
          python - <<'EOF'
          from transformers import AutoModel, AutoModelForSequenceClassification, AutoTokenizer
          for name in ("BAAI/bge-base-en-v1.5", "BAAI/bge-reranker-base"):
              AutoTokenizer.from_pretrained(name)
          AutoModel.from_pretrained("BAAI/bge-base-en-v1.5")
          AutoModelForSequenceClassification.from_pretrained("BAAI/bge-reranker-base")
          EOF

      - name: Build Go CLI
        timeout-minutes: 5
        run: make build-go

      - name: "AC1: plain docker compose up -d starts infra only"
        timeout-minutes: 5
        run: |
          docker compose up -d
          got="$(docker compose ps -a --services | sort | tr '\n' ' ')"
          want="kafka kafka-init minio minio-data-init minio-init postgres "
          echo "docker compose ps -a --services: $got"
          echo "config --services: $(docker compose config --services | wc -l); with --profile workers: $(docker compose --profile workers config --services | wc -l)"
          { echo "### AC1 plain \`docker compose up -d\`"; echo '```'; docker compose ps -a --services | sort; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$got" = "$want" ] || { echo "::error::expected only infra services: $want"; exit 1; }
          # Resolved image evidence for the S3 services (references come from the compose file, not from this workflow).
          docker compose images minio minio-init
          for c in arxivlens-minio arxivlens-minio-init; do
            img="$(docker inspect --format '{{.Config.Image}}' "$c")"
            echo "$c: $img $(docker image inspect --format '{{json .RepoDigests}}' "$img")"
          done

      - name: "AC2: make stack-up"
        timeout-minutes: 25
        run: |
          make stack-up
          docker compose --profile workers ps -a
          { echo "### AC2 \`docker compose --profile workers ps -a\`"; echo '```'; docker compose --profile workers ps -a; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for c in arxivlens-processor arxivlens-embedder-worker; do echo "== $c health log"; docker inspect -f '{{range .State.Health.Log}}{{.Output}}{{end}}' "$c"; done

      # Before the crawl, so the extra consumer never sees a message (it never commits either).
      - name: "Worker health follows this container, not the group"
        timeout-minutes: 12
        run: |
          probe="$(docker inspect -f '{{json .Config.Healthcheck.Test}}' arxivlens-processor | jq -r '.[3]')"
          img="$(docker inspect -f '{{.Config.Image}}' arxivlens-processor)"
          net="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.NetworkID}}{{end}}' arxivlens-processor)"
          dc() { docker compose --profile workers "$@"; }
          groups() { dc exec -T kafka /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group processor-v1 --members 2>/dev/null; }
          members() { groups | grep -c '^processor-v1 ' || true; }
          wait_members() { for _ in $(seq 60); do [ "$(members)" = "$1" ] && return 0; sleep 2; done; echo "::error::processor-v1 never had $1 members"; return 1; }
          python - <<'EOF' > other-consumer.log 2>&1 &
          import os, time
          from confluent_kafka import Consumer
          c = Consumer({"bootstrap.servers": "localhost:29092", "group.id": "processor-v1", "enable.auto.commit": False})
          c.subscribe(["papers.downloaded"])
          end = time.time() + 400
          while time.time() < end and not os.path.exists("stop-other"):
              c.poll(1.0)
          c.close()
          EOF
          wait_members 2; groups
          ok=0; for _ in $(seq 10); do dc exec -T processor python -c "$probe" && { ok=1; break; }; sleep 3; done
          [ "$ok" = 1 ] || { echo "::error::probe failed in the running processor with 2 members"; exit 1; }
          dc stop processor
          wait_members 1; groups   # the killed worker leaves after the 45 s session timeout; the host consumer stays
          # Same image, network and env as the processor, but no worker inside: the old group-level probe passed here.
          if docker run --rm --network "$net" -e WORKER_HEARTBEAT_FILE=/run/arxivlens/heartbeat "$img" python -c "$probe"; then
            echo "::error::probe passed in a container that is not the group member"; exit 1
          fi
          echo "OK: probe fails in a processor container that isn't the member, while another consumer stays in processor-v1"
          touch stop-other; wait; cat other-consumer.log
          dc start processor
          for _ in $(seq 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' arxivlens-processor)" = healthy ] && exit 0; sleep 5; done
          echo "::error::processor not healthy again after restart"; exit 1

      - name: Migrate
        timeout-minutes: 2
        run: make migrate

      - name: "AC3: crawl 2 papers (before the downloader starts)"
        timeout-minutes: 2
        run: |
          echo "::error::OPS-H10 AC3 scratch: forced failure before the host services start"; exit 1

      - name: Start Go downloader and query service on the host
        timeout-minutes: 2
        run: |
          nohup ./bin/arxivlens download > downloader.log 2>&1 &
          echo $! > downloader.pid
          nohup ./bin/arxivlens query --port 8080 > query.log 2>&1 &
          echo $! > query.pid
          for _ in $(seq 30); do curl -fsS localhost:8080/healthz && exit 0; sleep 2; done
          echo "::error::query service not healthy after 60s"; exit 1

      - name: "AC3: wait until both crawled papers are embedded"
        timeout-minutes: 16
        run: |
          q() { docker compose exec -T postgres psql -U postgres -d arxivlens -tA -c "$1"; }
          deadline=$((SECONDS + 900))
          until [ "$(q "select count(*) from papers where status = 'embedded'")" = 2 ] \
             && [ "$(q "select count(*) from papers")" = 2 ]; do
            q "select arxiv_id, status from papers order by arxiv_id"
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::papers not embedded after 15 min"
              for t in papers.discovered.dlq papers.downloaded.dlq papers.chunked.dlq; do ./bin/arxivlens dlq list --topic "$t"; done
              exit 1
            fi
            sleep 10
          done
          { echo "### AC3 \`arxivlens status\`"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for id in $(q "select arxiv_id from papers order by arxiv_id"); do
            ./bin/arxivlens status --arxiv-id "$id" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for t in papers.discovered.dlq papers.downloaded.dlq papers.chunked.dlq; do
            ./bin/arxivlens dlq list --topic "$t"
            end="$(docker compose exec -T kafka /opt/kafka/bin/kafka-get-offsets.sh --bootstrap-server localhost:9092 --topic "$t" --time -1 \
              | awk -F: '{s += $3} END {print s + 0}')"
            [ "$end" = 0 ] || { echo "::error::$t holds $end records"; exit 1; }
          done

      - name: Seed the M3/M4 fixture (on-demand ingest of 2608.20331)
        id: seed
        timeout-minutes: 8
        run: |
          sleep 3
          # curl waits longer than the server's INGEST_TIMEOUT (default 5m), so a real failure shows the server's error.
          code="$(curl -sS -m 360 -o ingest.json -w '%{http_code}' -X POST localhost:8080/v1/papers/ingest \
            -H 'Content-Type: application/json' -d '{"arxiv_id":"2608.20331"}')"
          cat ingest.json; echo
          [ "$code" = 200 ] || { echo "::error::ingest returned HTTP $code"; exit 1; }
          ./bin/arxivlens status --arxiv-id 2608.20331

      - name: "AC4: make test-full"
        timeout-minutes: 20
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$ARXIVLENS_HF_CACHE"
          set +e
          read -ra f1 <<< "$F1_TESTS"
          make test-full PYTEST_ARGS="$(printf -- '--deselect %s ' "${f1[@]}")" 2>&1 | tee test-full.log
          rc=${PIPESTATUS[0]}
          {
            echo "### AC4 \`make test-full\` (exit $rc; F1 deselected: $F1_TESTS)"; echo '```'
            if grep -q 'short test summary info' test-full.log; then sed -n '/short test summary info/,$p' test-full.log; else tail -n 1 test-full.log; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: "Known failure F1 (CPU rerank latency, tracked)"
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set +e
          make test-full TESTS="$F1_TESTS" 2>&1 | tee test-f1.log
          rc=${PIPESTATUS[0]}
          {
            echo "### Known failure F1 (exit $rc; expected to fail on CPU runners until the F1 follow-up lands)"; echo '```'
            tail -n 5 test-f1.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Every run, green or red, so the artifact always has service logs (embedder rerank timing for ADR-0015).
      - name: Collect service logs
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p stack-logs || true
          docker compose --profile workers logs --no-color --timestamps > stack-logs/compose.log 2>&1 || true
          for f in downloader.log query.log ingest.json; do
            if [ -f "$f" ]; then cp "$f" stack-logs/ || true; fi
          done
          t=stack-logs/embedder-timing.log
          grep -F -e 'rerank passages=' -e 'rerank warm-up' -e 'torch threads' stack-logs/compose.log > "$t" || true
          [ -s "$t" ] || echo "no embedder rerank timing lines (embedder predates AI-9)" > "$t" || true
          { echo "### Embedder rerank timing"; echo '```'; head -n 200 "$t"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          ls -l stack-logs || true

      - name: Diagnostics
        if: "failure()"
        timeout-minutes: 5
        run: |
          mkdir -p stack-logs
          docker compose --profile workers ps -a | tee stack-logs/ps.txt
          for f in compose.log downloader.log query.log ingest.json; do
            if [ -f "stack-logs/$f" ]; then echo "== $f"; cat "stack-logs/$f"; fi
          done
          for t in papers.discovered.dlq papers.downloaded.dlq papers.chunked.dlq; do
            ./bin/arxivlens dlq list --topic "$t" || true
          done | tee stack-logs/dlq.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs
          path: |
            stack-logs/
            test-full.log
            test-f1.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Teardown
        if: always()
        timeout-minutes: 5
        run: |
          for p in downloader.pid query.pid; do
            if [ -f "$p" ]; then kill "$(cat "$p")" 2>/dev/null || true; fi
          done
          docker compose --profile workers down -v
          sudo chown -R "$(id -u):$(id -g)" "$ARXIVLENS_HF_CACHE" || true
