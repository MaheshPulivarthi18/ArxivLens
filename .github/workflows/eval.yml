name: Eval

# Full stack, make eval-seed (31 corpus IDs = 62 arXiv requests), make eval. No secrets. Design: arxivlens-agents EVAL-3.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
    paths:
      - .github/workflows/eval.yml

permissions:
  contents: read

# One global group: the shared resource is arXiv politeness, so runs queue and never overlap.
concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ARXIVLENS_HF_CACHE: /home/runner/.cache/huggingface
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Lint the harness (actionlint, compose config)
        timeout-minutes: 3
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/eval.yml
          docker compose config --quiet
      # Same key as stack.yml, so either workflow warms the other. Explicit restore/save: a gate-red run still saves.
      - name: Restore Hugging Face models
        id: hf
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-base-en-v1.5-bge-reranker-base
      - name: Host Python deps (make setup-py, CPU torch)
        timeout-minutes: 10
        run: make setup-py
      - name: Pre-fetch models (offline on a cache hit, so a missing file fails instead of downloading)
        timeout-minutes: 10
        env:
          HIT: ${{ steps.hf.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then export HF_HUB_OFFLINE=1; fi
          echo "cache-hit=${HIT:-false} HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}"
          python -c 'import transformers as t; e, r = "BAAI/bge-base-en-v1.5", "BAAI/bge-reranker-base"
          t.AutoTokenizer.from_pretrained(e); t.AutoTokenizer.from_pretrained(r)
          t.AutoModel.from_pretrained(e); t.AutoModelForSequenceClassification.from_pretrained(r)'
      - name: Save Hugging Face models (before any container writes)
        if: steps.hf.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-base-en-v1.5-bge-reranker-base
      - name: Build Go CLI, make stack-up, migrate
        timeout-minutes: 32
        run: make build-go && make stack-up && make migrate
      - name: Start the query service on the host
        timeout-minutes: 2
        run: |
          nohup ./bin/arxivlens query --port 8080 > query.log 2>&1 & echo $! > query.pid
          for _ in $(seq 30); do curl -fsS localhost:8080/healthz && exit 0; sleep 2; done
          echo "::error::query service not healthy after 60s"; exit 1
      - name: "Self-test: eval-seed fails on an unreachable API (no arXiv request)"
        timeout-minutes: 2
        run: |
          printf '0000.00000\n' > "$RUNNER_TEMP/one-id.txt"; set +e
          make eval-seed EVAL_CORPUS="$RUNNER_TEMP/one-id.txt" ARXIVLENS_API_URL=http://127.0.0.1:9 \
            EVAL_SEED_LOG="$RUNNER_TEMP/selftest.tsv" 2>&1 | sed 's/^::error::/(expected) /'
          rc=${PIPESTATUS[0]}; set -e; cat "$RUNNER_TEMP/selftest.tsv"
          if [ "$rc" -eq 0 ] || ! awk -F'\t' '$1 == "0000.00000" && $2 == 3 && $3 == "000" {f = 1} END {exit !f}' \
            "$RUNNER_TEMP/selftest.tsv"; then echo "::error::eval-seed must exit non-zero after 3 attempts with HTTP 000"; exit 1; fi
          echo "OK: eval-seed exited $rc after 3 attempts"
      - name: make eval-seed (31 corpus IDs from arXiv)
        timeout-minutes: 45
        run: |
          set +e; make eval-seed 2>&1 | tee seed.log
          rc=${PIPESTATUS[0]}
          { echo "### make eval-seed: exit $rc"; echo '```'; cat seed-ids.log; tail -n 3 seed.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Machine profile
        timeout-minutes: 1
        env:
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          { echo "### Machine profile"; echo '```'; echo "commit under test (github.sha): $SHA; main (base) SHA: $BASE_SHA"
            lscpu | grep -E '^(Model name|CPU\(s\))'; free -g; echo "embedder /healthz: $(curl -fsS localhost:8081/healthz)"
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      # No continue-on-error and no threshold edits: a latency-red gate is a finding (ADR-0010, Technical PRD §9).
      # make exits 2 for any failed recipe, so the gate's own 0/1/2 is read from make's "*** [...eval] Error N" line.
      - name: make eval
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$ARXIVLENS_HF_CACHE"
          set +e; make eval 2>&1 | tee eval.log
          mrc=${PIPESTATUS[0]}; rc=0
          if [ "$mrc" -ne 0 ]; then rc="$(grep -oE '(\[| )eval\] Error [0-9]+' eval.log | grep -oE '[0-9]+$' | tail -n 1)"; [ "${rc:-2}" -le 1 ] || rc=2; fi
          { echo "### make eval: exit $rc (0 pass · 1 gate fail · 2 could not run)"; echo '```'
            sed -n '/^=====/,/^GATE:/p' eval.log; if [ "$rc" = 2 ]; then tail -n 20 eval.log; fi
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: |
            evals/results/*.json
            *.log
          if-no-files-found: warn
          retention-days: 30
      - name: Collect stack logs
        if: failure()
        timeout-minutes: 5
        run: |
          mkdir -p stack-logs; docker compose --profile workers ps -a | tee stack-logs/ps.txt
          docker compose --profile workers logs --no-color --timestamps > stack-logs/compose.log 2>&1
      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-stack-logs-${{ github.run_id }}
          path: stack-logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Teardown
        if: always()
        timeout-minutes: 5
        run: |
          if [ -f query.pid ]; then kill "$(cat query.pid)" 2>/dev/null || true; fi
          docker compose --profile workers down -v
          sudo chown -R "$(id -u):$(id -g)" "$ARXIVLENS_HF_CACHE" || true
