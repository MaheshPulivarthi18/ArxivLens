name: DB

# Real PostgreSQL + pgvector checks (OPS-H5): migrations on a fresh DB are idempotent and create the
# HNSW index; the vector arm of the hybrid query is planned and measured against an exact scan.
# OPS-H9: pgvector >= 0.8.0 check (hnsw.iterative_scan) and the EVAL-5 real_postgres eval-data test.
# ING-6c: crawl watermark SQL and the crawl-loop advisory lock (internal/db, -tags integration).
# B-PIPE: migration 000004 (DLQ replay tables), the replay Store and a resumed replay on real Kafka (internal/dlq).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    name: DB (migrate twice, HNSW plan + recall)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same pin as docker-compose.yml (image-pins.yml checks they match). Re-pin: CONTRIBUTING.md "Pinned images".
        image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arxivlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d arxivlens"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:3.7.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
        ports: ["9092:9092"]
        options: --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/arxivlens?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-go
      - name: Schema snapshot query
        run: |
          echo "PSQL=docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d arxivlens -v ON_ERROR_STOP=1" >> "$GITHUB_ENV"
          PSQL="docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d arxivlens -v ON_ERROR_STOP=1"
          cat > /tmp/snapshot.sql <<'SQL'
          SELECT 'extension', extname, extversion FROM pg_extension
          UNION ALL SELECT 'column', table_name || '.' || column_name, data_type
            FROM information_schema.columns WHERE table_schema = 'public'
          UNION ALL SELECT 'index', indexname, indexdef FROM pg_indexes WHERE schemaname = 'public'
          UNION ALL SELECT 'index_valid', indexrelid::regclass::text, indisvalid::text
            FROM pg_index i JOIN pg_class c ON c.oid = i.indrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public'
          ORDER BY 1, 2;
          SQL
          $PSQL -At < /tmp/snapshot.sql > /tmp/run0.txt
          echo "Objects before migrate (fresh DB):"; cat /tmp/run0.txt
          if grep -v '^extension|plpgsql|' /tmp/run0.txt; then echo "::error::DB is not fresh"; exit 1; fi
      - name: Migrate run 1 (fresh DB)
        run: |
          ./bin/arxivlens migrate
          $PSQL -At < /tmp/snapshot.sql > /tmp/run1.txt
          $PSQL -c '\d chunk_embeddings'
          $PSQL -c "SELECT indexname, indexdef FROM pg_indexes WHERE tablename = 'chunk_embeddings' ORDER BY 1;"
          grep -E '^index\|chunk_embeddings_hnsw_idx\|.*USING hnsw \(embedding halfvec_cosine_ops\) WITH \(m=.?16.?, ef_construction=.?64.?\)' /tmp/run1.txt
          grep -E '^index_valid\|chunk_embeddings_hnsw_idx\|true$' /tmp/run1.txt
          grep -E '^column\|paper_chunk_pages\.page_start\|integer$' /tmp/run1.txt
          grep -E '^column\|dlq_replay_checkpoints\.next_offset\|bigint$' /tmp/run1.txt
          grep -E '^column\|dlq_replay_log\.dlq_offset\|bigint$' /tmp/run1.txt
      - name: Migrate run 2 (idempotent, schema unchanged)
        run: |
          ./bin/arxivlens migrate
          $PSQL -At < /tmp/snapshot.sql > /tmp/run2.txt
          diff -u /tmp/run1.txt /tmp/run2.txt
          echo "Schema identical after run 2: $(wc -l < /tmp/run2.txt) objects (extensions, columns, indexes)"
          grep -E '^column\|dlq_replay_(checkpoints|log)\.' /tmp/run2.txt
      - name: Migration 000004 down drops the DLQ replay tables (then up again)
        run: |
          $PSQL < migrations/000004_dlq_replay.down.sql
          left="$($PSQL -At -c "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('dlq_replay_checkpoints', 'dlq_replay_log')")"
          echo "dlq_replay tables after 000004 down: $left"
          [ "$left" = 0 ] || { echo "::error::000004 down left $left table(s)"; exit 1; }
          $PSQL < migrations/000004_dlq_replay.up.sql
      - name: pgvector >= 0.8.0 (hnsw.iterative_scan, OPS-H5)
        run: |
          MIN=0.8.0
          # true when $1 >= $2 (dotted versions, numeric per component); false unless $1 is all digits and dots
          version_ge() { [[ $1 =~ ^[0-9]+(\.[0-9]+)*$ ]] && [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }
          echo "Dry run of the comparison against MIN=$MIN:"
          for v in 0.5.1 0.7.4 0.7.99 "" missing abc 0.8.0-dev; do
            if version_ge "$v" "$MIN"; then echo "::error::self-test: '$v' passed, want fail"; exit 1; fi
            echo "  '$v' -> fail (expected)"
          done
          for v in 0.8.0 0.8.7 0.10.0 1.0.0; do
            if ! version_ge "$v" "$MIN"; then echo "::error::self-test: '$v' failed, want pass"; exit 1; fi
            echo "  '$v' -> pass (expected)"
          done
          GOT="$($PSQL -At -c "SELECT extversion FROM pg_extension WHERE extname = 'vector'")"
          echo "pg_extension vector extversion: '${GOT}'"
          if ! version_ge "$GOT" "$MIN"; then
            echo "::error::pgvector extension is '${GOT:-missing}', need >= $MIN (hnsw.iterative_scan in search.go). Re-pin the postgres image: CONTRIBUTING.md \"Pinned images\"."
            exit 1
          fi
          echo "pgvector $GOT >= $MIN: ok"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Eval-data SQL on real Postgres (EVAL-5, tests/test_evals_data.py -k real_postgres)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          python -m pip install --quiet "psycopg[binary]>=3.1.0" "pytest>=8.0.0"
          python -m pytest -v -rA tests/test_evals_data.py -k real_postgres | tee /tmp/real_postgres.txt
          # A skip (no DATABASE_URL, psycopg missing) must not pass as green.
          if grep -Eq '[0-9]+ skipped' /tmp/real_postgres.txt || ! grep -Eq '[1-9][0-9]* passed' /tmp/real_postgres.txt; then
            echo "::error::real_postgres tests did not all run and pass (skipped or none collected)"; exit 1
          fi
      - name: HNSW plan + recall + search provenance (real search.go SQL)
        run: |
          go vet -tags integration ./internal/query/
          go test -tags integration -count=1 -v -timeout 20m -run 'TestHNSW|TestSearchProvenance' ./internal/query/
      - name: Crawl watermark SQL + crawl-loop lock (ING-6a1, ING-6c)
        run: |
          set -o pipefail
          go vet -tags integration ./internal/db/
          go test -tags integration -count=1 -v -run '^(TestAdvanceWatermarkMonotonic|TestCrawlLoopLock)$' ./internal/db/ | tee /tmp/db-it.txt
          # -v prints a SKIP line when DATABASE_URL is missing: that must not pass as green.
          if grep -q -- '--- SKIP' /tmp/db-it.txt; then echo "::error::watermark/lock integration tests skipped"; exit 1; fi
          for t in TestAdvanceWatermarkMonotonic TestCrawlLoopLock; do grep -q -- "--- PASS: $t " /tmp/db-it.txt || { echo "::error::$t did not pass"; exit 1; }; done
          left="$($PSQL -At -c "SELECT count(*) FROM crawl_watermarks WHERE category LIKE 'it-test.%'")"
          echo "crawl_watermarks rows left by the tests (category LIKE 'it-test.%'): $left"
          [ "$left" = 0 ] || { echo "::error::test rows not cleaned up"; exit 1; }
      - name: DLQ reader on real Kafka + replay Store and resume on real Postgres (B-PIPE)
        run: |
          set -o pipefail
          go vet -tags integration ./internal/dlq/
          KAFKA_BROKERS=localhost:9092 go test -tags integration -race -count=1 -v -timeout 10m ./internal/dlq/ | tee /tmp/dlq-it.txt
          if grep -q -- '--- SKIP' /tmp/dlq-it.txt; then echo "::error::DLQ integration tests skipped"; exit 1; fi
          for t in TestReadStopsAtSnapshot_Integration TestPGStore_Integration TestReplayResumes_Integration; do
            grep -q -- "--- PASS: $t " /tmp/dlq-it.txt || { echo "::error::$t did not pass"; exit 1; }
          done
          left="$($PSQL -At -c "SELECT (SELECT count(*) FROM dlq_replay_log WHERE dlq_topic LIKE 'it.dlq.%') + (SELECT count(*) FROM dlq_replay_checkpoints WHERE dlq_topic LIKE 'it.dlq.%')")"
          echo "dlq_replay rows left by the tests (dlq_topic LIKE 'it.dlq.%'): $left"
          [ "$left" = 0 ] || { echo "::error::test rows not cleaned up"; exit 1; }
