version: '3.8'

# Python workers (profile "workers"): plain `docker compose up -d` starts infra only;
# `make stack-up` (= `docker compose --profile workers up -d --build` + health wait) starts everything.
x-worker: &worker
  profiles: [workers]
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/arxivlens
    KAFKA_BROKERS: kafka:9092
    MINIO_ENDPOINT: minio:9000
    HF_HOME: /root/.cache/huggingface
  volumes:
    # Named volume by default (models download once); set ARXIVLENS_HF_CACHE to an absolute host path to bind-mount it.
    - ${ARXIVLENS_HF_CACHE:-hf_cache}:/root/.cache/huggingface

x-worker-build-args: &worker_build_args
  TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}

# Worker healthcheck: the consumer group (argv[1]) is STABLE with >= 1 member. Workers load their model before they
# subscribe, so a member means "model loaded and consuming". Per group, not per container: a host-run worker in the
# same group also satisfies it.
x-group-check: &group_check >-
  import os, sys;
  from confluent_kafka.admin import AdminClient;
  g = AdminClient({"bootstrap.servers": os.environ["KAFKA_BROKERS"]}).describe_consumer_groups([sys.argv[1]])[sys.argv[1]].result(timeout=10);
  sys.exit(0 if g.state.name == "STABLE" and len(g.members) > 0 else 1)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arxivlens-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arxivlens
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=256MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arxivlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: arxivlens-kafka
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: arxivlens-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

      echo 'Creating 12-partition topics and DLQs...'
      for topic in papers.discovered papers.discovered.dlq papers.downloaded papers.downloaded.dlq papers.chunked papers.chunked.dlq; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 12 --replication-factor 1
      done

      echo 'Listing Kafka topics:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

  minio:
    image: minio/minio:latest
    container_name: arxivlens-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: arxivlens-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/arxiv-papers;
      /usr/bin/mc anonymous set download myminio/arxiv-papers;
      echo 'MinIO bucket arxiv-papers ready';
      exit 0;
      "

  embedder-api:
    <<: *worker
    build:
      context: .
      dockerfile: services/embedder/Dockerfile
      args: *worker_build_args
    container_name: arxivlens-embedder-api
    command: ["python", "services/embedder/api.py"]
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # /healthz answers once the startup hook has loaded BGE; also require the cross-encoder (M3 and evals need it).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/healthz | grep -q '\"reranker\":true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 600s # cold start downloads ~1.5 GB of models into the HF cache

  processor:
    <<: *worker
    build:
      context: .
      dockerfile: services/processor/Dockerfile
      args: *worker_build_args
    container_name: arxivlens-processor
    depends_on:
      embedder-api:
        condition: service_healthy # models are in the HF cache before the workers load them
    healthcheck:
      test: ["CMD", "python", "-c", *group_check, "processor-v1"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 300s

  embedder-worker:
    <<: *worker
    build:
      context: .
      dockerfile: services/embedder/Dockerfile
      args: *worker_build_args
    container_name: arxivlens-embedder-worker
    depends_on:
      embedder-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", *group_check, "embedder-v1"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 300s

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  hf_cache:
